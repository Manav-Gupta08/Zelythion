[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelscan"
version = "0.1.0"
description = "An extensible, evidence-driven web application security scanner"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Manav Gupta", email = "manavgupta0808@gmail.com" }
]
keywords = ["security", "scanner", "appsec", "owasp", "pentest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-beautifulsoup4>=4.12.0",
]

[project.scripts]
sentinel = "sentinelscan.cli:app"

[project.urls]
Repository = "https://github.com/Manav-Gupta08/sentinelscan"
Issues = "https://github.com/Manav-Gupta08/sentinelscan/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelscan"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
]
ignore = [
    "S101",  # assert statements (used in tests)
    "S105",  # hardcoded passwords (test fixtures)
    "S106",  # hardcoded passwords in function args
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

[tool.coverage.run]
source = ["src/sentinelscan"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
